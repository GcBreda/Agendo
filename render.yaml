# Demonstração online do Agendô (Render Blueprint).
# Cria um PostgreSQL gratuito e um único serviço web que serve o site e a API no mesmo endereço.
# Só dados fictícios. Passo a passo em docs/demo-online.md.

databases:
  - name: agendo-demo-db
    plan: free
    region: virginia
    databaseName: agendo
    user: agendo

services:
  - type: web
    name: agendo-demo
    runtime: node
    plan: free
    region: virginia
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npx prisma generate --schema src/prisma/schema.prisma
    startCommand: >-
      cd backend && npx prisma migrate deploy --schema src/prisma/schema.prisma &&
      node src/prisma/seed.js && node src/prisma/seed-demo.js && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # O site chama a API no mesmo endereço
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: agendo-demo-db
          property: connectionString
      # Segredos gerados pelo próprio Render (nunca vão para o Git)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: PRONTUARIO_KEY
        generateValue: true
