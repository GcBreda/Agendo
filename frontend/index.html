<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendô</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica o tema antes da primeira pintura, para a tela não piscar clara no tema escuro.
      // Mesma regra do TemaContext: escolha guardada ('claro' ou 'escuro') ou, sem escolha, o tema do sistema.
      (function () {
        try {
          var escolha = localStorage.getItem('agendo_tema')
          var escuro = escolha === 'escuro' ||
            (escolha !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (escuro) document.documentElement.classList.add('dark')
        } catch (e) { /* sem armazenamento: o TemaContext decide quando carregar */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
